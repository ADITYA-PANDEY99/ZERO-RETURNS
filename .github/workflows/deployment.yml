name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-audit:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit safety

      - name: Run Flake8 (Linting)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Bandit (Security Audit)
        run: |
          bandit -r backend -x backend/app/tests --level=high

      - name: Run Safety Check (Dependency Scan)
        run: |
          # Scans dependencies for known vulnerabilities
          safety check -r backend/requirements.txt --ignore 70612 || true

  test:
    name: Backend Test Suite (Unit & Integration)
    runs-on: ubuntu-latest
    needs: lint-and-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx pytest-asyncio

      - name: Run Unit & Integration Tests
        cwd: ./backend
        run: |
          python -m pytest app/tests/test_backend.py

  build-verification:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Frontend Compilation
        cwd: ./frontend
        run: |
          npm ci
          npm run build

      - name: Verify Docker Builds
        run: |
          docker compose build

  deploy:
    name: Deploy to Production Targets
    runs-on: ubuntu-latest
    needs: build-verification
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Vercel Production Deploy
        run: |
          echo "Deploying frontend client to Vercel production edge..."
          # In a real pipeline, Vercel CLI would be invoked here:
          # curl -X POST https://api.vercel.com/v1/integrations/deploy/...

      - name: Trigger Render Backend Deploy
        run: |
          echo "Deploying FastAPI backend server to Render web service..."
          # In a real pipeline, Render deploy webhook would be triggered:
          # curl -Ssf https://api.render.com/deploy/srv-...
